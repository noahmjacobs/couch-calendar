<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover lets the page paint behind the status bar and home indicator;
       the safe-area insets in App.css keep content clear of them -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- black-translucent lets a home-screen launch draw behind the status bar too,
       the standalone counterpart to viewport-fit=cover -->
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Couch App">
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">
  <!-- matched to the top edge of the app gradient, not a flat black/white: iOS paints
       the status bar area with this whenever the web app is not drawing under it -->
  <meta name="theme-color" content="#e9f0fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)">
  <title>Couch App</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>

# Prints the exchange's data (event reports and Brindex reports) to the job
# log, so the pricing committee can read what the household submitted without
# touching the database from anywhere else. It runs on every push to main and
# can be run by hand from the Actions tab. The exchange path is readable by
# anyone, so this needs no secret.
name: Read the exchange
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Event reports and Brindex reports
        run: |
          curl -sSf 'https://couch-reservation-default-rtdb.firebaseio.com/exchange.json' \
            | python3 -c '
          import json, sys
          d = json.load(sys.stdin) or {}
          # one line per record, oldest first, so the newest reports are at the end
          for kind in sorted(d):
              items = d[kind] or {}
              for id in sorted(items, key=lambda k: (items[k] or {}).get("at", "")):
                  print(kind, id, json.dumps(items[id], ensure_ascii=False))
          print("DONE", sum(len(v or {}) for v in d.values()), "records")
          '

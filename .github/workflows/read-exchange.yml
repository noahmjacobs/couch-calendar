# Prints the exchange's data (event reports and Brindex reports) to the job
# log, so the pricing committee can read what the household submitted without
# touching the database from anywhere else. Run it from the Actions tab or the
# API. The exchange path is readable by anyone, so this needs no secret.
name: Read the exchange
on:
  workflow_dispatch:
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Event reports and Brindex reports
        run: |
          curl -sSf 'https://couch-reservation-default-rtdb.firebaseio.com/exchange.json' \
            | python3 -c 'import json,sys; d=json.load(sys.stdin) or {}; print(json.dumps(d, indent=2, sort_keys=True, ensure_ascii=False))'
